[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirige /api/claude a la función de Netlify
[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200
